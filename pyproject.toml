[project]
name = "online-cinema-project"
version = "0.1.0"
description = ""
authors = [
    {name = "Serhii Hryniuk",email = "serhiibhryniuk@gmail.com"}
]
requires-python = "^3.14"
dependencies = [
    "fastapi (>=0.138.2,<0.139.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "sqlalchemy[asyncio] (>=2.0.51,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "pyjwt[crypto] (>=2.13.0,<3.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "redis (>=8.0.1,<9.0.0)",
    "stripe (>=15.3.0,<16.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "aiosmtplib (>=5.1.2,<6.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "greenlet (>=3.5.3,<4.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
